name: E2E (manual)

# Runs the Playwright end-to-end specs that need no voice model on a GitHub-hosted Windows desktop.
# Trigger it from the Actions tab (workflow_dispatch); it is not part of the push/PR checks.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright against the built app
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: End-to-end tests
        run: >
          npx playwright test --reporter=list
          tests/e2e/app.spec.ts
          tests/e2e/assistant.spec.ts
          tests/e2e/circle.spec.ts
          tests/e2e/edge-glow.spec.ts
          tests/e2e/hotkeys.spec.ts
          tests/e2e/onboarding.spec.ts
          tests/e2e/settings.spec.ts

      - name: Keep the traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results
          retention-days: 7
